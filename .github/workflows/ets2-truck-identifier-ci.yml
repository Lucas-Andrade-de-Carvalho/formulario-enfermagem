name: ETS2 Truck Identifier Tractor Test x64

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/ets2-truck-identifier-tractor-test'

jobs:
  release-x64:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct baseline
        shell: powershell
        run: |
          $parts = Get-ChildItem 'ci\ets2-src.part*.b64' | Sort-Object Name
          $b64 = (($parts | ForEach-Object { (Get-Content $_.FullName -Raw -Encoding ASCII).Trim() }) -join '')
          [IO.File]::WriteAllBytes('ci\ets2-src.tar.gz', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'ci\ets2-src.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '3278dc58701fb0ba29b9e5fad297b8615687a54dbe7c1bbe3001bfb2f6d7a7f2') { throw "Baseline SHA-256 mismatch: $hash" }
          New-Item -ItemType Directory -Force 'ci\ETS2-Truck-Identifier' | Out-Null
          tar -xzf 'ci\ets2-src.tar.gz' -C 'ci\ETS2-Truck-Identifier'
          if ($LASTEXITCODE -ne 0) { throw "Source extraction failed: $LASTEXITCODE" }

      - name: Apply previous MSVC fixes safely
        shell: powershell
        run: |
          $root = 'ci\ETS2-Truck-Identifier'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          foreach ($rel in @('src\plugin\telemetry_plugin.cpp','src\gui\telemetry_client.cpp','src\gui\local_resolver.cpp','src\gui\main.cpp','src\gui\windows_support.cpp')) {
            $p = Join-Path $root $rel
            $text = Get-Content $p -Raw -Encoding UTF8
            $text = $text -replace '(?m)^#define WIN32_LEAN_AND_MEAN\r?\n', ''
            $text = $text -replace '(?m)^#define NOMINMAX\r?\n', ''
            [IO.File]::WriteAllText($p,$text,$utf8)
          }
          $p=Join-Path $root 'src\core\save_resolver.cpp'; $text=Get-Content $p -Raw -Encoding UTF8; $text=$text.Replace('[](unsigned char c){return std::tolower(c);}','[](unsigned char c){return static_cast<char>(std::tolower(c));}'); [IO.File]::WriteAllText($p,$text,$utf8)
          $p=Join-Path $root 'tests\core_tests.cpp'; $text=Get-Content $p -Raw -Encoding UTF8; $text=$text -replace '(?<![0-9A-Za-z_.])(-?(?:1\.5|1\.2|\.8|\.6|\.5))(?![0-9A-Za-z_f])','${1}f'; [IO.File]::WriteAllText($p,$text,$utf8)
          $p=Join-Path $root 'src\gui\main.cpp'; $text=Get-Content $p -Raw -Encoding UTF8; foreach($id in @('ID_INSTALL','ID_UNINSTALL','ID_OPEN')){$text=$text.Replace("reinterpret_cast<HMENU>($id)","reinterpret_cast<HMENU>(static_cast<INT_PTR>($id))")}; [IO.File]::WriteAllText($p,$text,$utf8)
          $p=Join-Path $root 'tools\build-windows.ps1'; $text=Get-Content $p -Raw -Encoding UTF8; $old='$relative = [IO.Path]::GetRelativePath($Package, $file.FullName).Replace(''\'',''/'')'; $new='$relative = $file.FullName.Substring($Package.Length).TrimStart([char]92).Replace(''\'',''/'')'; if(-not $text.Contains($old)){throw 'Packaging compatibility baseline mismatch.'}; $text=$text.Replace($old,$new); [IO.File]::WriteAllText($p,$text,$utf8)

      - name: Apply current cabin paint Unicode patch
        shell: powershell
        run: |
          $parts = Get-ChildItem 'ci\current-fix.part*.b64' | Sort-Object Name
          $b64 = (($parts | ForEach-Object { (Get-Content $_.FullName -Raw -Encoding ASCII).Trim() }) -join '')
          $gz='ci\current-fix.patch.gz'; [IO.File]::WriteAllBytes($gz,[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash $gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne 'ad3e923b684f8018b52cf53b4ddd1e48320bf079a5d795c811d9578449464933'){throw "Fix patch SHA-256 mismatch: $hash"}
          $patch='ci\current-fix.patch'; $input=[IO.File]::OpenRead($gz)
          try{$gzip=New-Object IO.Compression.GzipStream($input,[IO.Compression.CompressionMode]::Decompress);try{$output=[IO.File]::Create($patch);try{$gzip.CopyTo($output)}finally{$output.Dispose()}}finally{$gzip.Dispose()}}finally{$input.Dispose()}
          Push-Location 'ci\ETS2-Truck-Identifier'; try{git apply --check '..\current-fix.patch';if($LASTEXITCODE -ne 0){throw 'Patch preflight failed.'};git apply '..\current-fix.patch';if($LASTEXITCODE -ne 0){throw 'Patch apply failed.'}}finally{Pop-Location}
          $strict=New-Object System.Text.UTF8Encoding($false,$true); $main=$strict.GetString([IO.File]::ReadAllBytes('ci\ETS2-Truck-Identifier\src\gui\main.cpp'))
          $expected=@(('Instala'+[char]0x00E7+[char]0x00E3+'o'),('Caminh'+[char]0x00E3+'o'),('N'+[char]0x00C3+'O INSTALADO'),('ETS2 TRUCK IDENTIFIER '+[char]0x2014+' TRACTOR ONLY'))
          foreach($x in $expected){if(-not $main.Contains($x)){throw 'UTF-8 source regression before MSVC.'}}

      - name: MSVC Release x64 regress Unicode smoke and package
        shell: powershell
        working-directory: ci/ETS2-Truck-Identifier
        run: .\tools\build-windows.ps1

      - name: Final binary audit
        shell: powershell
        run: |
          $root=(Resolve-Path 'ci\ETS2-Truck-Identifier').Path
          $exe=Join-Path $root 'build-win\src\gui\Release\ETS2TruckIdentifier.exe'
          $dll=Join-Path $root 'build-win\src\plugin\Release\ets2_truck_identifier.dll'
          $zip=Join-Path $root 'dist\ETS2_Truck_Identifier_TRACTOR_TEST_x64.zip'
          $report=Join-Path $root 'dist\BUILD_REPORT.txt'
          foreach($p in @($exe,$dll,$zip,$report)){if(-not(Test-Path $p)){throw "Missing output: $p"}}
          function Pe([string]$p){$b=[IO.File]::ReadAllBytes($p);$o=[BitConverter]::ToInt32($b,0x3c);$opt=$o+24;[pscustomobject]@{Machine=[BitConverter]::ToUInt16($b,$o+4);Magic=[BitConverter]::ToUInt16($b,$opt);Entry=[BitConverter]::ToUInt32($b,$opt+16);Subsystem=[BitConverter]::ToUInt16($b,$opt+68)}}
          $e=Pe $exe;$d=Pe $dll
          if($e.Magic-ne 0x20b -or $d.Magic-ne 0x20b){throw 'PE32+ audit failed.'};if($e.Machine-ne 0x8664 -or $d.Machine-ne 0x8664){throw 'AMD64 audit failed.'};if($e.Subsystem-ne 2 -or $e.Entry-eq 0){throw 'GUI subsystem/entrypoint audit failed.'}
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe';$vs=(&$vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim();$dumpbin=Get-ChildItem(Join-Path $vs 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe')|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName
          $ed=(&$dumpbin /DEPENDENTS $exe 2>&1|Out-String);if($LASTEXITCODE-ne 0){throw 'EXE imports audit failed.'};$dd=(&$dumpbin /DEPENDENTS $dll 2>&1|Out-String);if($LASTEXITCODE-ne 0){throw 'DLL imports audit failed.'};$exports=(&$dumpbin /EXPORTS $dll 2>&1|Out-String);if($LASTEXITCODE-ne 0){throw 'DLL exports audit failed.'}
          if(($ed+$dd)-match '(?i)(ucrtbased\.dll|vcruntime[^ \r\n]*d\.dll|msvcp[^ \r\n]*d\.dll)'){throw 'Debug CRT detected.'};foreach($n in @('scs_telemetry_init','scs_telemetry_shutdown')){if($exports-notmatch[regex]::Escape($n)){throw "Missing export: $n"}}
          Add-Content -Encoding ASCII $report @('FINAL LINK: PASS','PE FORMAT EXE/DLL: PE32+','MACHINE EXE/DLL: AMD64 (0x8664)','SUBSYSTEM EXE: WINDOWS GUI','ENTRYPOINT EXE: VALID','IMPORTS EXE/DLL: VALID','DEBUG CRT: NONE','PLUGIN EXPORTS DUMPBIN: VALID','REGRESSIONS INTRODUCED: 0')

      - name: Upload corrected test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ETS2_Truck_Identifier_TRACTOR_TEST_x64_FIXED
          path: |
            ci/ETS2-Truck-Identifier/dist/ETS2_Truck_Identifier_TRACTOR_TEST_x64.zip
            ci/ETS2-Truck-Identifier/dist/BUILD_REPORT.txt
          if-no-files-found: error
