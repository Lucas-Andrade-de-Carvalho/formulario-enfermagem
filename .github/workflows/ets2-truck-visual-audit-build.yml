name: ETS2 Truck Visual Identifier CabinPaint audited x64

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/ets2-truck-visual-audit-build'

jobs:
  release-x64:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify chunks and reconstruct audited source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $manifestPath='ci\visual-audit-src.manifest.txt'
          if(-not(Test-Path $manifestPath)){throw 'Chunk manifest missing.'}
          $lines=[IO.File]::ReadAllLines((Resolve-Path $manifestPath),[Text.Encoding]::ASCII)
          $countLine=$lines|Where-Object{$_ -like 'PART_COUNT=*'}|Select-Object -First 1
          $finalLine=$lines|Where-Object{$_ -like 'EXPECTED_FINAL_SHA256=*'}|Select-Object -First 1
          if(-not$countLine-or-not$finalLine){throw 'Manifest header incomplete.'}
          $expectedCount=[int]($countLine.Split('=',2)[1])
          $expectedFinal=$finalLine.Split('=',2)[1].ToLowerInvariant()
          if($expectedCount-ne9){throw "Unexpected PART_COUNT=$expectedCount"}
          if($expectedFinal-ne'dde42fcf89b07c820fe9953a743cae8915d5c1f65a7853ee42d1db52d084625c'){throw "Unexpected manifest final SHA=$expectedFinal"}
          $rows=@{}
          foreach($line in $lines|Where-Object{$_ -like 'PART=*'}){
            $fields=@{};foreach($cell in $line.Split('|')){$kv=$cell.Split('=',2);if($kv.Count-ne2){throw "Malformed manifest row: $line"};$fields[$kv[0]]=$kv[1]}
            $idx=[int]$fields['PART'];if($rows.ContainsKey($idx)){throw "Duplicate manifest index: $idx"};$rows[$idx]=$fields
          }
          if($rows.Count-ne$expectedCount){throw "Manifest row count mismatch: $($rows.Count)"}
          $remoteParts=@(Get-ChildItem 'ci\visual-audit-src.part*.b64' -File)
          if($remoteParts.Count-ne$expectedCount){throw "PARTS FOUND=$($remoteParts.Count), EXPECTED=$expectedCount"}
          $expectedNames=0..8|ForEach-Object{'visual-audit-src.part{0:D2}.b64'-f$_}
          foreach($p in $remoteParts){if($expectedNames-notcontains$p.Name){throw "Unexpected audited source part: $($p.Name)"}}
          $archive='ci\audited-source.tar.gz'
          if(Test-Path $archive){Remove-Item $archive -Force}
          $out=[IO.File]::Open($archive,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try{
            for($i=0;$i-lt$expectedCount;$i++){
              $row=$rows[$i];$name=$row['NAME'];$path=Join-Path 'ci' $name
              if($name-ne('visual-audit-src.part{0:D2}.b64'-f$i)){throw "Manifest order/name mismatch at ${i}: $name"}
              if(-not(Test-Path $path)){throw "Missing part ${i}: $path"}
              [byte[]]$raw=[IO.File]::ReadAllBytes((Resolve-Path $path))
              if($raw.Length-ne[int]$row['SIZE']){throw "Part $i size mismatch expected=$($row['SIZE']) actual=$($raw.Length)"}
              $actualPart=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if($actualPart-ne$row['SHA256'].ToLowerInvariant()){throw "Part $i SHA mismatch expected=$($row['SHA256']) actual=$actualPart"}
              foreach($b in $raw){if($b-gt127){throw "Part $i contains non-ASCII byte: $b"};if($b-eq10-or$b-eq13-or$b-eq32-or$b-eq9){throw "Part $i contains whitespace byte: $b"}}
              $text=[Text.Encoding]::ASCII.GetString($raw)
              if(($text.Length%4)-ne0-or$text-notmatch'^[A-Za-z0-9+/]*={0,2}$'){throw "Part $i is not strict Base64"}
              try{[byte[]]$decoded=[Convert]::FromBase64String($text)}catch{throw "Part $i Base64 decode failed: $($_.Exception.Message)"}
              $out.Write($decoded,0,$decoded.Length)
              Write-Host "PART $i VERIFIED size=$($raw.Length) sha256=$actualPart decoded=$($decoded.Length)"
            }
          }finally{$out.Dispose()}
          $actualFinal=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PARTS EXPECTED: $expectedCount";Write-Host "PARTS FOUND: $($remoteParts.Count)";Write-Host 'MISSING: 0';Write-Host 'UNEXPECTED: 0';Write-Host 'DUPLICATES: 0'
          Write-Host "EXPECTED_SOURCE_SHA256=$expectedFinal";Write-Host "ACTUAL_SOURCE_SHA256=$actualFinal"
          if($actualFinal-ne$expectedFinal){throw "Reconstructed source SHA mismatch expected=$expectedFinal actual=$actualFinal"}
          $entries=@(& tar -tzf $archive);if($LASTEXITCODE-ne0-or-not$entries){throw 'Archive listing failed or archive empty.'}
          foreach($entry in $entries){$n=$entry.Replace('\','/');if($n.StartsWith('/')-or$n-match'^[A-Za-z]:'-or($n.Split('/')-contains'..')){throw "Unsafe archive path: $entry"}}
          if($entries-notcontains'ETS2-Truck-Visual-Identifier-v2/CMakeLists.txt'){throw 'Expected source root missing from archive.'}
          $work='ci\work';if(Test-Path $work){Remove-Item $work -Recurse -Force};New-Item -ItemType Directory -Force $work|Out-Null
          & tar -xzf $archive -C $work;if($LASTEXITCODE-ne0){throw "Source extraction failed: $LASTEXITCODE"}
          $root=Join-Path $work 'ETS2-Truck-Visual-Identifier-v2'
          foreach($f in @('CMakeLists.txt','tools\build-windows.ps1','src\core\current_truck_config.cpp','src\core\definition_resolver.cpp','src\gui\local_configuration.cpp','src\gui\windows_platform.cpp','src\gui\windows_integration_tests.cpp','tests\core_tests.cpp')){if(-not(Test-Path(Join-Path $root $f))){throw "Extracted source missing: $f"}}
          Add-Content $env:GITHUB_ENV "SOURCE_SHA256=$actualFinal"
          Add-Content $env:GITHUB_ENV "SOURCE_BRANCH=$env:GITHUB_REF_NAME"
          Add-Content $env:GITHUB_ENV "SOURCE_COMMIT=$env:GITHUB_SHA"
          @("SOURCE_ARCHIVE_SHA256=$actualFinal","BRANCH=$env:GITHUB_REF_NAME","COMMIT=$env:GITHUB_SHA")|Set-Content -Encoding ASCII 'ci\SOURCE_PROVENANCE.txt'

      - name: Apply audited MSVC portability fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $patch=(Resolve-Path 'ci\msvc-c4505.patch').Path
          $patchSha=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch='a74bf770033ec4ef23ef514baea5734831eeb4103e7a0dbd216fdecacdcdea82'
          if($patchSha-ne$expectedPatch){throw "MSVC patch SHA mismatch expected=$expectedPatch actual=$patchSha"}
          $subdir='ci/work/ETS2-Truck-Visual-Identifier-v2'
          $root=(Resolve-Path $subdir).Path
          $resultFile=Join-Path $root 'src\gui\windows_platform.cpp'
          $beforeSha=(Get-FileHash $resultFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedBefore='3ca9a55a0e50c05e036bae73621a90ee1df53e9c3ee2aa7ac4c364faabbfe3af'
          if($beforeSha-ne$expectedBefore){throw "Pre-patch windows_platform.cpp SHA mismatch expected=$expectedBefore actual=$beforeSha"}
          & git apply --check --whitespace=nowarn --directory=$subdir $patch
          if($LASTEXITCODE-ne0){throw "git apply --check failed: $LASTEXITCODE"}
          & git apply --whitespace=nowarn --directory=$subdir $patch
          if($LASTEXITCODE-ne0){throw "git apply failed: $LASTEXITCODE"}
          $resultSha=(Get-FileHash $resultFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedResult='4defdba6b1c39cdcabac769bf0c7c3046886eaab2878889cbd654cd31f49da93'
          if($resultSha-ne$expectedResult){throw "Patched windows_platform.cpp SHA mismatch expected=$expectedResult actual=$resultSha"}
          $identity="BASE=$env:SOURCE_SHA256`nPATCH=$patchSha`nRESULT_WINDOWS_PLATFORM=$resultSha`n"
          $sha=[Security.Cryptography.SHA256]::Create()
          try{$digest=$sha.ComputeHash([Text.Encoding]::ASCII.GetBytes($identity))}finally{$sha.Dispose()}
          $effective=([BitConverter]::ToString($digest)).Replace('-','').ToLowerInvariant()
          $expectedEffective='1cff8e9b4d6169eaf3dec1621b4e203621e4ac6a9066f847a3d51abc921f670f'
          if($effective-ne$expectedEffective){throw "Effective source identity mismatch expected=$expectedEffective actual=$effective"}
          Add-Content $env:GITHUB_ENV "BUILD_FIX_PATCH_SHA256=$patchSha"
          Add-Content $env:GITHUB_ENV "EFFECTIVE_SOURCE_ID=$effective"
          Add-Content -Encoding ASCII 'ci\SOURCE_PROVENANCE.txt' "BUILD_FIX_PATCH_SHA256=$patchSha"
          Add-Content -Encoding ASCII 'ci\SOURCE_PROVENANCE.txt' "RESULT_WINDOWS_PLATFORM_SHA256=$resultSha"
          Add-Content -Encoding ASCII 'ci\SOURCE_PROVENANCE.txt' "EFFECTIVE_SOURCE_ID=$effective"
          Write-Host "PRE_PATCH_WINDOWS_PLATFORM_SHA256=$beforeSha"
          Write-Host "BUILD_FIX_PATCH_SHA256=$patchSha"
          Write-Host "RESULT_WINDOWS_PLATFORM_SHA256=$resultSha"
          Write-Host "EFFECTIVE_SOURCE_ID=$effective"

      - name: Architecture and diagnostics invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$root='ci\work\ETS2-Truck-Visual-Identifier-v2'
          $cfg=Get-Content (Join-Path $root 'src\core\current_truck_config.cpp') -Raw -Encoding UTF8
          foreach($t in @('assigned_vehicles','player_vehicles','player.assigned_vehicles->player_vehicles.vehicle','accessory_cabin_data','CONFIGURATION_FINGERPRINT')){if(-not$cfg.Contains($t)){throw "Current-truck invariant missing: $t"}}
          $paint=Get-Content (Join-Path $root 'src\core\definition_resolver.cpp') -Raw -Encoding UTF8
          foreach($t in @('CONFIG_BASE_COLOR_RAW','DEF_BASE_COLOR_RAW','EFFECTIVE_BASE_COLOR_RAW','LINEAR_RGB','DISPLAY_SRGB','COLOR_SPACE','PAINT_FAILURE_REASON')){if(-not$paint.Contains($t)){throw "Paint invariant missing: $t"}}
          $local=Get-Content (Join-Path $root 'src\gui\local_configuration.cpp') -Raw -Encoding UTF8
          foreach($t in @('Localization module','CURRENT_TRUCK_SAVE_REF','ACTIVE_PROFILE','ACTIVE_SAVE','CONFIGURATION_UNIT')){if(-not$local.Contains($t)){throw "VFS/save/localization invariant missing: $t"}}
          $win=Get-Content (Join-Path $root 'src\gui\windows_platform.cpp') -Raw -Encoding UTF8
          $uninstallFailed='DESINSTALA'+[char]0x00C7+[char]0x00C3+'O FALHOU'
          $operationCancelled='OPERA'+[char]0x00C7+[char]0x00C3+'O CANCELADA'
          foreach($t in @('install.manifest','PluginOwnership',$uninstallFailed,$operationCancelled,'RunInstallUninstallSelfTest')){if(-not$win.Contains($t)){throw "Uninstall invariant missing: $t"}}
          if($win.Contains('static fs::path PluginDest()')){throw 'Removed dead PluginDest() unexpectedly present after audited patch.'}

      - name: MSVC Release x64 build Windows tests and package
        shell: powershell
        working-directory: ci/work/ETS2-Truck-Visual-Identifier-v2
        run: .\tools\build-windows.ps1

      - name: Final PE Unicode smoke and package audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'ci\work\ETS2-Truck-Visual-Identifier-v2').Path
          $exe=Join-Path $root 'build-win\src\gui\Release\ETS2TruckVisualIdentifier.exe'
          $dll=Join-Path $root 'build-win\src\plugin\Release\ets2_truck_visual_identifier.dll'
          $tool=Join-Path $root 'third_party\scs_tool\scs_tool.exe'
          $dist=Join-Path $root 'dist';$pkg=Join-Path $dist 'ETS2_Truck_Visual_Identifier_CabinPaint_TEST_x64';$zip=Join-Path $dist 'ETS2_Truck_Visual_Identifier_CabinPaint_TEST_x64.zip';$report=Join-Path $dist 'BUILD_REPORT.txt'
          foreach($p in @($exe,$dll,$tool,$pkg,$zip,$report)){if(-not(Test-Path $p)){throw "Missing required output: $p"}}
          function Pe([string]$p){[byte[]]$b=[IO.File]::ReadAllBytes($p);if($b.Length-lt512-or$b[0]-ne0x4d-or$b[1]-ne0x5a){throw "Invalid MZ: $p"};$o=[BitConverter]::ToInt32($b,0x3c);if($o-lt0-or$o+96-ge$b.Length-or$b[$o]-ne0x50-or$b[$o+1]-ne0x45){throw "Invalid/truncated PE: $p"};$opt=$o+24;[pscustomobject]@{Machine=[BitConverter]::ToUInt16($b,$o+4);Magic=[BitConverter]::ToUInt16($b,$opt);Entry=[BitConverter]::ToUInt32($b,$opt+16);Subsystem=[BitConverter]::ToUInt16($b,$opt+68)}}
          $ei=Pe $exe;$di=Pe $dll;$ti=Pe $tool;foreach($x in @(@('EXE',$ei),@('PLUGIN',$di),@('SCS_TOOL',$ti))){if($x[1].Magic-ne0x20b-or$x[1].Machine-ne0x8664-or$x[1].Entry-eq0){throw "$($x[0]) is not valid AMD64 PE32+"}};if($ei.Subsystem-ne2){throw 'GUI subsystem is not Windows GUI.'}
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe';$vs=(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim();if(-not$vs){throw 'Visual Studio not found.'};$dumpbin=Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe')|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName
          foreach($p in @($exe,$dll)){ $deps=(& $dumpbin /DEPENDENTS $p 2>&1|Out-String);if($LASTEXITCODE-ne0){throw "dumpbin failed: $p"};if($deps-match'(?i)(msvcp[^ \r\n]*\.dll|vcruntime[^ \r\n]*\.dll|ucrtbased\.dll)'){throw "Unexpected dynamic/debug MSVC CRT: $p"}}
          $exports=(& $dumpbin /EXPORTS $dll 2>&1|Out-String);if($LASTEXITCODE-ne0){throw 'Plugin export audit failed.'};foreach($n in @('scs_telemetry_init','scs_telemetry_shutdown')){if($exports-notmatch[regex]::Escape($n)){throw "Missing plugin export: $n"}}
          if(-not('Ets2ViNative'-as[type])){Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Ets2ViNative {
            [DllImport("kernel32.dll",CharSet=CharSet.Unicode,SetLastError=true)] public static extern IntPtr LoadLibraryW(string path);
            [DllImport("kernel32.dll")] public static extern bool FreeLibrary(IntPtr h);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr SendMessageTimeoutW(IntPtr hWnd,uint Msg,UIntPtr wParam,IntPtr lParam,uint flags,uint timeout,out UIntPtr result);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool PostMessageW(IntPtr hWnd,uint Msg,UIntPtr wParam,IntPtr lParam);
          }
          '@}
          $h=[Ets2ViNative]::LoadLibraryW($dll);if($h-eq[IntPtr]::Zero){throw "Plugin LoadLibraryW failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())"};[void][Ets2ViNative]::FreeLibrary($h)
          function Has([byte[]]$h,[byte[]]$n){for($i=0;$i-le$h.Length-$n.Length;$i++){$ok=$true;for($j=0;$j-lt$n.Length;$j++){if($h[$i+$j]-ne$n[$j]){$ok=$false;break}};if($ok){return $true}};return $false}
          $install='Instala'+[char]0x00E7+[char]0x00E3+'o:';$truck='Caminh'+[char]0x00E3+'o:';$nao='N'+[char]0x00C3+'O INSTALADO';$title='ETS2 TRUCK VISUAL IDENTIFIER '+[char]0x2014+' TRACTOR ONLY';[byte[]]$eb=[IO.File]::ReadAllBytes($exe)
          foreach($s in @($install,$truck,$nao,'IDENTIFICANDO...','Desconhecido',$title)){if(-not(Has $eb ([Text.Encoding]::Unicode.GetBytes($s)))){throw "UTF-16 UI string missing: $s"}}
          foreach($s in @('Instala'+[char]0x00C3+[char]0x00A7,'Caminh'+[char]0x00C3+[char]0x00A3,[string][char]0xFFFD)){if(Has $eb ([Text.Encoding]::Unicode.GetBytes($s))){throw 'Mojibake/replacement sequence embedded in EXE.'}}
          $proc=Start-Process -FilePath $exe -PassThru;try{if(-not$proc.WaitForInputIdle(5000)){throw 'GUI did not reach input-idle.'};Start-Sleep -Milliseconds 1000;$proc.Refresh();if($proc.HasExited){throw "GUI immediate crash: $($proc.ExitCode)"};if($proc.MainWindowTitle-ne$title){throw "Unexpected title: $($proc.MainWindowTitle)"};[UIntPtr]$r=[UIntPtr]::Zero;$ok=[Ets2ViNative]::SendMessageTimeoutW($proc.MainWindowHandle,0,[UIntPtr]::Zero,[IntPtr]::Zero,2,1000,[ref]$r);if($ok-eq[IntPtr]::Zero){throw 'GUI not responsive.'};if(-not[Ets2ViNative]::PostMessageW($proc.MainWindowHandle,0x0010,[UIntPtr]::Zero,[IntPtr]::Zero)){throw 'WM_CLOSE failed.'};if(-not$proc.WaitForExit(5000)){throw 'GUI did not exit cleanly.'};if($proc.ExitCode-ne0){throw "GUI exit=$($proc.ExitCode)"}}finally{if($proc-and-not$proc.HasExited){Stop-Process -Id $proc.Id -Force}}
          $allowed=@('ETS2TruckVisualIdentifier.exe','README.txt','SHA256SUMS.txt','THIRD_PARTY_NOTICES.md','Runtime/ets2_truck_visual_identifier.dll','Runtime/scs_tool.exe');$actual=Get-ChildItem $pkg -Recurse -File|ForEach-Object{$_.FullName.Substring($pkg.Length).TrimStart([char]92).Replace('\','/')};foreach($a in $allowed){if($actual-notcontains$a){throw "Package missing: $a"}};foreach($a in $actual){if($allowed-notcontains$a){throw "Unexpected package file: $a"}}
          $forbidden=Get-ChildItem $pkg -Recurse -File|Where-Object{$_.Extension-in@('.obj','.pdb','.lib','.exp','.ilk','.cpp','.h','.hpp','.ps1','.vcxproj','.sln')};if($forbidden){throw "Forbidden package artifact: $($forbidden.FullName -join ', ')"}
          $readme=Get-Content (Join-Path $pkg 'README.txt') -Raw -Encoding UTF8;foreach($m in @('TESTE A','TESTE B','TESTE C','TESTE D','TESTE E','TESTE F','TruckVisualIdentity.log')){if(-not$readme.Contains($m)){throw "README marker missing: $m"}}
          Add-Content -Encoding ASCII $report "SOURCE_ARCHIVE_SHA256=$env:SOURCE_SHA256";Add-Content -Encoding ASCII $report "BUILD_FIX_PATCH_SHA256=$env:BUILD_FIX_PATCH_SHA256";Add-Content -Encoding ASCII $report "EFFECTIVE_SOURCE_ID=$env:EFFECTIVE_SOURCE_ID";Add-Content -Encoding ASCII $report "BRANCH=$env:SOURCE_BRANCH";Add-Content -Encoding ASCII $report "COMMIT=$env:SOURCE_COMMIT";Add-Content -Encoding ASCII $report 'WINDOWS HASHFS/VFS TEST: PASS (ctest)';Add-Content -Encoding ASCII $report 'CABIN/PAINT WINDOWS TESTS: PASS (ctest)';Add-Content -Encoding ASCII $report 'UNINSTALL WINDOWS TEST: PASS';Add-Content -Encoding ASCII $report 'FINAL PE AUDIT: PASS';Add-Content -Encoding ASCII $report 'WINDOWS GUI SMOKE TEST: PASS';Add-Content -Encoding ASCII $report 'PACKAGE AUDIT: PASS'
          Copy-Item 'ci\SOURCE_PROVENANCE.txt' (Join-Path $dist 'SOURCE_PROVENANCE.txt') -Force

      - name: Upload audited CabinPaint package
        uses: actions/upload-artifact@v4
        with:
          name: ETS2_Truck_Visual_Identifier_CabinPaint_TEST_x64
          path: |
            ci/work/ETS2-Truck-Visual-Identifier-v2/dist/ETS2_Truck_Visual_Identifier_CabinPaint_TEST_x64.zip
            ci/work/ETS2-Truck-Visual-Identifier-v2/dist/BUILD_REPORT.txt
            ci/work/ETS2-Truck-Visual-Identifier-v2/dist/SOURCE_PROVENANCE.txt
          if-no-files-found: error
