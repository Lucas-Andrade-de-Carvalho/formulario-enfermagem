name: ETS2 Truck Visual Identifier real config x64

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/ets2-truck-visual-identifier-v2'

jobs:
  release-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact real-config source
        shell: powershell
        run: |
          $parts = 0..5 | ForEach-Object { 'ci\visual-realfix-src.part{0:D2}.b64' -f $_ }
          foreach($p in $parts){if(-not(Test-Path $p)){throw "Missing source segment: $p"}}
          $b64=(($parts|ForEach-Object{(Get-Content $_ -Raw -Encoding ASCII).Trim()}) -join '')
          [IO.File]::WriteAllBytes('ci\realfix-source.tar.gz',[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash 'ci\realfix-source.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '0916e39e7909d703c0e2b4ea2a564413439c57af271ff46a2cf85b64c5675c13'){throw "Source SHA mismatch: $hash"}
          New-Item -ItemType Directory -Force 'ci\work'|Out-Null
          tar -xzf 'ci\realfix-source.tar.gz' -C 'ci\work'
          if($LASTEXITCODE-ne 0){throw "Source extraction failed: $LASTEXITCODE"}
          $root='ci\work\ETS2-Truck-Visual-Identifier-v2'
          foreach($p in @('tools\build-windows.ps1','src\core\current_truck_config.cpp','src\core\definition_resolver.cpp','src\gui\local_configuration.cpp','src\gui\windows_platform.cpp')){if(-not(Test-Path(Join-Path $root $p))){throw "Snapshot missing: $p"}}
          Add-Content $env:GITHUB_ENV "SOURCE_SHA256=$hash"

      - name: Source-chain invariants
        shell: powershell
        run: |
          $root='ci\work\ETS2-Truck-Visual-Identifier-v2'
          $config=Get-Content (Join-Path $root 'src\core\current_truck_config.cpp') -Raw -Encoding UTF8
          foreach($t in @('assigned_truck','vehicle_paint_job_accessory','ASSIGNED_TRUCK_REJECTED','ACCESSORY_COUNT')){if(-not $config.Contains($t)){throw "Missing current-config invariant: $t"}}
          $def=Get-Content (Join-Path $root 'src\core\definition_resolver.cpp') -Raw -Encoding UTF8
          foreach($t in @('accessory_cabin_data','accessory_paint_job_data','BASE_COLOR_RAW','BASE_RGB','PAINT_MODE','CABIN_RESOLVED_VFS_PATH','PAINT_RESOLVED_VFS_PATH','LinearToSrgb')){if(-not $def.Contains($t)){throw "Missing resolver invariant: $t"}}
          $local=Get-Content (Join-Path $root 'src\gui\local_configuration.cpp') -Raw -Encoding UTF8
          foreach($t in @('New profile selected','ACTIVE_SAVE','VFS_MOUNT_COUNT','SAVE_REJECTED','CURRENT_VEHICLE_UNIT')){if(-not $local.Contains($t)){throw "Missing local-config invariant: $t"}}
          $platform=Get-Content (Join-Path $root 'src\gui\windows_platform.cpp') -Raw -Encoding UTF8
          foreach($t in @('install.manifest','PluginOwnership','RunInstallUninstallSelfTest','ShellExecuteExW','GetModuleFileNameW','TruckVisualIdentity.log')){if(-not $platform.Contains($t)){throw "Missing uninstall/log invariant: $t"}}

      - name: MSVC Release x64 build regress and package
        shell: powershell
        working-directory: ci/work/ETS2-Truck-Visual-Identifier-v2
        run: .\tools\build-windows.ps1

      - name: Final PE smoke and package audit
        shell: powershell
        run: |
          $root=(Resolve-Path 'ci\work\ETS2-Truck-Visual-Identifier-v2').Path
          $pkg=Join-Path $root 'dist\ETS2_Truck_Visual_Identifier_TEST_x64'
          $zip=Join-Path $root 'dist\ETS2_Truck_Visual_Identifier_TEST_x64.zip'
          $exe=Join-Path $pkg 'ETS2TruckVisualIdentifier.exe'
          $dll=Join-Path $pkg 'Runtime\ets2_truck_visual_identifier.dll'
          $tool=Join-Path $pkg 'Runtime\scs_tool.exe'
          $report=Join-Path $root 'dist\BUILD_REPORT.txt'
          foreach($p in @($pkg,$zip,$exe,$dll,$tool,$report)){if(-not(Test-Path $p)){throw "Missing final output: $p"}}

          function Pe([string]$p){
            [byte[]]$b=[IO.File]::ReadAllBytes($p);if($b.Length-lt 512-or$b[0]-ne 0x4d-or$b[1]-ne 0x5a){throw "Invalid MZ: $p"}
            $o=[BitConverter]::ToInt32($b,0x3c);if($o-lt 0-or($o+96)-ge$b.Length){throw "Truncated PE: $p"};if($b[$o]-ne 0x50-or$b[$o+1]-ne 0x45){throw "Invalid PE: $p"}
            $opt=$o+24;[pscustomobject]@{Machine=[BitConverter]::ToUInt16($b,$o+4);Magic=[BitConverter]::ToUInt16($b,$opt);Entry=[BitConverter]::ToUInt32($b,$opt+16);Subsystem=[BitConverter]::ToUInt16($b,$opt+68)}
          }
          $ei=Pe $exe;$di=Pe $dll;$ti=Pe $tool
          foreach($x in @($ei,$di,$ti)){if($x.Machine-ne 0x8664-or$x.Magic-ne 0x20b-or$x.Entry-eq 0){throw 'AMD64/PE32+/entry audit failed'}}
          if($ei.Subsystem-ne 2){throw 'EXE is not Windows GUI subsystem'}

          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $dumpbin=Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe')|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName
          $depsExe=(& $dumpbin /DEPENDENTS $exe 2>&1|Out-String);if($LASTEXITCODE-ne 0){throw 'EXE imports failed'}
          $depsDll=(& $dumpbin /DEPENDENTS $dll 2>&1|Out-String);if($LASTEXITCODE-ne 0){throw 'DLL imports failed'}
          $exports=(& $dumpbin /EXPORTS $dll 2>&1|Out-String);if($LASTEXITCODE-ne 0){throw 'DLL exports failed'}
          if(($depsExe+$depsDll)-match '(?i)(vcruntime[^ \r\n]*\.dll|msvcp[^ \r\n]*\.dll|ucrtbased\.dll)'){throw 'Unexpected dynamic/debug MSVC CRT'}
          foreach($n in @('scs_telemetry_init','scs_telemetry_shutdown')){if($exports-notmatch$n){throw "Missing export: $n"}}

          & $exe '--package-self-test';if($LASTEXITCODE-ne 0){throw "Install/uninstall self-test failed: $LASTEXITCODE"}

          $title='ETS2 TRUCK VISUAL IDENTIFIER '+[char]0x2014+' TRACTOR ONLY'
          $proc=Start-Process $exe -PassThru
          try{
            if(-not$proc.WaitForInputIdle(5000)){throw 'GUI input-idle timeout'};Start-Sleep -Milliseconds 1000;$proc.Refresh()
            if($proc.HasExited){throw 'GUI immediate crash'};if($proc.MainWindowTitle-ne$title){throw 'Unicode window title mismatch'}
            if(-not('CiNative' -as [type])){Add-Type 'using System;using System.Runtime.InteropServices;public static class CiNative{[DllImport("user32.dll")]public static extern IntPtr SendMessageTimeoutW(IntPtr h,uint m,UIntPtr w,IntPtr l,uint f,uint t,out UIntPtr r);[DllImport("user32.dll")]public static extern bool PostMessageW(IntPtr h,uint m,UIntPtr w,IntPtr l);}' }
            [UIntPtr]$r=[UIntPtr]::Zero;if([CiNative]::SendMessageTimeoutW($proc.MainWindowHandle,0,[UIntPtr]::Zero,[IntPtr]::Zero,2,1000,[ref]$r)-eq[IntPtr]::Zero){throw 'GUI not responding'}
            [void][CiNative]::PostMessageW($proc.MainWindowHandle,0x10,[UIntPtr]::Zero,[IntPtr]::Zero);if(-not$proc.WaitForExit(5000)){throw 'GUI clean-exit timeout'};if($proc.ExitCode-ne 0){throw 'GUI clean-exit failure'}
          }finally{if($proc-and-not$proc.HasExited){Stop-Process $proc.Id -Force}}

          $forbidden=Get-ChildItem $pkg -Recurse -File|Where-Object{$_.Extension-in @('.obj','.lib','.pdb','.ilk','.exp','.cpp','.h','.hpp','.ps1','.vcxproj','.sln')};if($forbidden){throw 'Forbidden file in package'}
          $manifest=Join-Path $pkg 'SHA256SUMS.txt';foreach($line in Get-Content $manifest){$q=$line -split '  ',2;$p=Join-Path $pkg ($q[1].Replace('/','\'));if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()-ne$q[0]){throw "Manifest mismatch: $($q[1])"}}
          Add-Content -Encoding ASCII $report @("SOURCE SHA-256: $env:SOURCE_SHA256","COMMIT: $env:GITHUB_SHA","WORKFLOW RUN: $env:GITHUB_RUN_ID",'FINAL PE AUDIT: PASS','PLUGIN EXPORTS: PASS','WINDOWS GUI SMOKE: PASS','GUI RESPONSIVE: PASS','CLEAN EXIT: PASS','INSTALL/UNINSTALL SELF-TEST: PASS','PACKAGE AUDIT: PASS')

      - name: Upload real-config test package
        uses: actions/upload-artifact@v4
        with:
          name: ETS2_Truck_Visual_Identifier_TEST_x64_REAL_CONFIG
          path: |
            ci/work/ETS2-Truck-Visual-Identifier-v2/dist/ETS2_Truck_Visual_Identifier_TEST_x64.zip
            ci/work/ETS2-Truck-Visual-Identifier-v2/dist/BUILD_REPORT.txt
          if-no-files-found: error
